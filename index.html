<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F3F2ED"><title>时笺</title><link rel="icon" type="image/x-icon" href="icon-original.ico"><link rel="icon" type="image/png" href="icon-solid.png"><link rel="apple-touch-icon" href="icon-solid.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="account.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header class="toolbar"><h1>时笺</h1><span id="status" role="status">已保存到本机</span><button id="account" type="button">登录同步</button><details><summary>备份</summary><div><button id="export">导出备份</button><button id="import">导入备份</button></div></details><input type="file" id="file" accept="application/json" hidden></header><main class="notebook"><div class="date-line"><label>日期 <input type="date" id="date" aria-label="日期"></label><span id="weekday"></span><div class="day-turn"><button id="prev" aria-label="前一天">‹</button><button id="today">今天</button><button id="next" aria-label="后一天">›</button></div></div><section class="tasks"><h2>待办事项</h2><div id="tasks" class="task-grid"></div><div class="row-controls" role="group" aria-label="待办事项增删"><button id="addTask" aria-label="增加一个待办事项" title="增加一个事项">＋</button><button id="removeTask" aria-label="删除最后一个待办事项" title="删除最后一个事项">−</button></div></section><div class="schedule"><section class="column"><div class="schedule-body"><div id="plans"></div></div></section><section class="column"><div class="schedule-body"><div id="actuals"></div><div class="row-controls" role="group" aria-label="日程左右同步增删行"><button id="addSchedule" aria-label="日程左右同时增加一行" title="左右同时增加一行">＋</button><button id="removeSchedule" aria-label="日程左右同时删除末行" title="左右同时删除末行">−</button></div></div></section></div><section class="notes"><div class="notes-heading"><label for="notes">备注</label><div class="notes-totals"><div class="total">△ 计划学习时间 <output id="planned">0 小时 00 分</output></div><div class="total">△ 实际学习时间 <output id="actual">0 小时 00 分</output></div></div></div><textarea id="notes" aria-label="备注" rows="3"></textarea></section><div class="legend">△ 勾选日程左侧的方框，计入学习时间；时长自动相加。</div></main><p id="message" role="status"></p><dialog id="accountDialog" aria-labelledby="accountTitle"><div class="dialog-heading"><h2 id="accountTitle">账号与同步</h2><button type="button" data-close="accountDialog" aria-label="关闭账号窗口">×</button></div><p id="accountState"></p><form id="authForm"><label>邮箱<input id="email" type="email" autocomplete="email" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><div class="auth-actions"><button type="submit">登录</button><button id="signup" type="button">注册</button><button id="forgot" type="button">忘记密码</button></div></form><form id="resetForm" hidden><label>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">保存新密码</button></form><div id="signedIn" hidden><p id="signedEmail"></p><p id="emailState"></p><button id="verifyEmail" type="button">验证邮箱（可选）</button><form id="emailCodeForm" hidden><label>邮箱验证码<input id="emailCode" inputmode="numeric" autocomplete="one-time-code" required></label><button id="confirmEmailCode" type="submit">确认验证码</button></form><button id="syncNow" type="button">立即同步</button><button id="signout" type="button">退出账号</button></div><p id="authMessage" role="status"></p></dialog>
<dialog id="migrationDialog" aria-labelledby="migrationTitle"><div class="dialog-heading"><h2 id="migrationTitle">带上原来的手账</h2><button type="button" data-close="migrationDialog" aria-label="暂不迁移">×</button></div><p>此设备有未登录时留下的记录。加入当前账号后，可在其他设备上查看；同一天的不同内容会请你选择保留版本。</p><button id="migrateGuest" type="button">将本机记录加入此账号</button><button id="skipMigration" type="button">暂不迁移</button></dialog>
<dialog id="conflictDialog" aria-labelledby="conflictTitle"><div class="dialog-heading"><h2 id="conflictTitle">这一天有两个版本</h2><button type="button" data-close="conflictDialog" aria-label="稍后处理">×</button></div><p id="conflictDate"></p><div class="conflict-versions"><section><h3>此设备</h3><pre id="localVersion"></pre></section><section><h3>云端</h3><pre id="cloudVersion"></pre></section></div><p>选择前会在本机备份两个版本。</p><button id="keepLocal" type="button">保留此设备版本</button><button id="keepCloud" type="button">保留云端版本</button><button id="exportConflicts" type="button">导出冲突备份</button></dialog><script type="module" src="app.js"></script></body></html>
