<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F3F2ED"><title>时笺</title><link rel="icon" type="image/x-icon" href="icon-original.ico"><link rel="icon" type="image/png" href="icon-solid.png"><link rel="apple-touch-icon" href="icon-solid.png"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header class="toolbar"><h1>时笺</h1><span id="status" role="status">自动保存</span><details><summary>备份</summary><div><button id="export">导出备份</button><button id="import">导入备份</button></div></details><input type="file" id="file" accept="application/json" hidden></header><main class="notebook"><div class="date-line"><label>日期 <input type="date" id="date" aria-label="日期"></label><span id="weekday"></span><div class="day-turn"><button id="prev" aria-label="前一天">‹</button><button id="today">今天</button><button id="next" aria-label="后一天">›</button></div></div><section class="tasks"><h2>待办事项</h2><div id="tasks" class="task-grid"></div><div class="row-controls" role="group" aria-label="待办事项增删"><button id="addTask" aria-label="增加一个待办事项" title="增加一个事项">＋</button><button id="removeTask" aria-label="删除最后一个待办事项" title="删除最后一个事项">−</button></div></section><div class="schedule"><section class="column"><div class="schedule-body"><div id="plans"></div></div></section><section class="column"><div class="schedule-body"><div id="actuals"></div><div class="row-controls" role="group" aria-label="日程左右同步增删行"><button id="addSchedule" aria-label="日程左右同时增加一行" title="左右同时增加一行">＋</button><button id="removeSchedule" aria-label="日程左右同时删除末行" title="左右同时删除末行">−</button></div></div></section></div><section class="notes"><div class="notes-heading"><label for="notes">备注</label><div class="notes-totals"><div class="total">△ 计划学习时间 <output id="planned">0 小时 00 分</output></div><div class="total">△ 实际学习时间 <output id="actual">0 小时 00 分</output></div></div></div><textarea id="notes" aria-label="备注" rows="3"></textarea></section><div class="legend">△ 勾选日程左侧的方框，计入学习时间；时长自动相加。</div></main><p id="message" role="status"></p><script type="module" src="app.js"></script></body></html>
