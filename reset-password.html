<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>设置新密码 · 时笺</title>
  <link rel="icon" href="icon-original.ico">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="account.css">
</head>
<body class="reset-page">
  <main class="reset-card">
    <h1>设置新密码</h1>
    <p id="resetStatus" role="status">正在检查重置链接…</p>
    <form id="passwordForm" hidden>
      <label>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>再次输入新密码<input id="repeatPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button id="savePassword" type="submit">保存新密码</button>
    </form>
    <a href="./">返回时笺</a>
  </main>
  <script type="module" src="reset-password.mjs"></script>
</body>
</html>
